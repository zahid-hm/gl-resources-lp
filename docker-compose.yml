# Used on the EC2 host by .github/workflows/deploy.yml. GHCR_IMAGE, plus the
# runtime secrets in .env (IPGEO_API_KEY, NEXT_PUBLIC_SITE_URL), are written
# to the host's .env file by the deploy workflow on every push to main.
services:
  web:
    image: ${GHCR_IMAGE}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
